# 转换参数外置配置示例（专属节点组 / 默认项）
#
# 使用方法：复制到 data/zurl/transform.yaml（容器内路径
# /opt/zurl/app/data/transform.yaml，data 目录已挂载进容器）：
#   cp config/zurl/transform.example.yaml data/zurl/transform.yaml
#
# 修改保存后，下一次订阅转换即生效，无需重建或重启容器。
# 现有部署请合并需要的配置，不要覆盖无关的自定义项。
#
# 规则：
# - 文件缺失或整份格式错误时回退内置默认，不追加自定义分组。
# - 单个条目不合法（正则无效、缺 name/filter 等）时跳过该条。
# - custom_groups: [] 表示完全关闭自定义组。
# - 机场订阅按 filter 在 mihomo 运行时筛选节点；静态节点直接点名进组。
# - 目标分组或节点不存在时不插入悬空引用。
#
# 字段说明（每一条 custom_groups 条目）：
#   name                 组名
#   filter               节点名正则（mihomo 侧运行时筛选）
#   type                 select / url-test / fallback / load-balance（默认 select）
#   providers            白名单：本组只挂这些订阅（缺省=全部）
#   exclude_providers    黑名单：本组不挂这些订阅
#   exclusive            true = 匹配的节点从其它所有分组的节点来源里隐藏
#                        （filter 前加负向前瞻；keep_in 中的组例外）
#   exclusive_providers  这些订阅整体从其它所有分组的 use 里摘掉，只留在本组
#                        与 keep_in 组（订阅级排他，节点名无法区分订阅来源）
#   keep_in              豁免组：不隐藏节点、不摘 provider
#   attach_to            把本组作为可选项挂到这些分组
#   attach_index         仅对 attach_to 目标生效：钉在指定顺位（0=首位，1=第二顺位）
#                        第二顺位不占默认项，专属组为空时不影响分组默认出口
#   attach_with          含这些锚点成员的分组，把本组紧跟锚点插入
#   attach_after         仅对 attach_to 目标生效：紧跟该成员插入
#   templates            仅在这些远程模板下生效（缺省=全部模板）

# 不改任何分组的默认项（默认项 = mihomo select 组首项，保持原版）。
group_defaults: []

custom_groups:
  # 一、流媒体节点：节点名带「流媒体」，只在媒体分组里可选，
  #     其它分组看不到这些节点，也不吃「示例机场」这个订阅的节点。
  - name: "流媒体节点"
    filter: "流媒体"
    type: url-test
    exclude_providers: ["示例机场"]
    exclusive: true
    attach_index: 1  # 第二顺位，不占默认项
    attach_to:
      - "🎶 TikTok"
      - "📹 YouTube"
      - "🎥 Netflix"
      - "🎥 DisneyPlus"
      - "🎥 HBO"
      - "🎥 PrimeVideo"
      - "🎥 AppleTV+"
      - "🎥 Emby"
      - "📺 Bahamut"
      - "🌎 国外媒体"

  # 二、AI 美国节点：只取某个订阅（供应商）的美国节点，只在 AI 分组里可选，
  #     该订阅的其它节点在别处一律不出现。
  #     providers / exclusive_providers 里写订阅转换页「提供商」列表中的实际名称。
  - name: "AI 美国节点"
    providers: ["示例机场"]
    filter: '(?i)(美国|(?<![a-z])us(?![a-z])|united[ _-]*states|🇺🇸)'
    type: select
    exclusive_providers: ["示例机场"]
    attach_index: 1  # 第二顺位
    attach_to:
      - "🤖 ChatGPT"
      - "🤖 AI服务"

