# 转换参数外置配置示例
#
# 使用方法：复制到 data/zurl/transform.yaml（容器内路径
# /opt/zurl/app/data/transform.yaml，data 目录已挂载进容器）：
#   cp config/zurl/transform.example.yaml data/zurl/transform.yaml
#
# 修改保存后，下一次订阅转换 / 「生成最新配置」即生效，
# 无需重建或重启任何容器。
#
# 规则：
# - 文件缺失或整份格式错误时，自动回退内置默认（内置默认为空：不追加
#   任何自定义分组，保持远程模板原样）
# - 单个条目不合法（正则无效、缺 name/filter 等）时跳过该条，其余继续生效
# - custom_groups: [] 置空表示完全关闭自定义组
# - 机场订阅按 filter 在 mihomo 运行时筛选节点；静态节点直接点名进组
# - exclusive: true 表示该组匹配的节点从其他分组中剔除（业务组/地区组/
#   手动选择等都不能再选到），只保留在本组和 keep_in 列出的组

# 各分组的默认选中项（mihomo select 组首项即默认）：默认不调整，
# 保持远程模板原样。需要时可按注释示例自行配置（保存后下次转换即生效）。

group_defaults: []

# 配置示例（需要时取消注释并按需调整；目标在配置中不存在时会跳过，
# 不会插入悬空引用；实际生效的配置见 data/zurl/transform.yaml）：
# - {group: "🔀 非标端口", default: "🎯 全球直连"}
# - {group: "⏬ PT站点", default: "🎯 全球直连"}
# - {group: "🤖 ChatGPT", default: "🇸🇬 新加坡节点"}
# - {group: "📹 YouTube", default: "🚀 手动选择"}

# 默认仅为 Custom_Clash / Custom_Clash_Full 追加两个流媒体组。
# 不设置 templates 的其他自定义组仍按原逻辑对全部模板生效。

custom_groups:
  - name: "日本流媒体"
    filter: "(?:日本.*流媒体|流媒体.*日本)"
    type: url-test
    templates: ["Custom_Clash.ini", "Custom_Clash_Full.ini"]
    attach_to: ["🎶 TikTok", "📹 YouTube"]
  - name: "美国流媒体"
    filter: "(?:美国.*流媒体|流媒体.*美国)"
    type: url-test
    templates: ["Custom_Clash.ini", "Custom_Clash_Full.ini"]
    attach_to: ["🎶 TikTok", "📹 YouTube"]

# 追加自定义组示例：
# - name: "IPLC 专线"
#   filter: "(?i)(iplc|专线)"
#   type: select              # 可选 select / url-test / fallback / load-balance
#   attach_to: ["🚀 手动选择"]  # 追加到这些组末尾
#   attach_after: "🇺🇸 美国节点"  # 可选：在目标组中紧跟该成员插入（需配合先置顶默认项，
#                                 # 可把自定义组固定为第二顺位）；成员不存在时退化追加末尾
#   exclusive: false
