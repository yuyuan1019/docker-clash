# 转换增强外置配置（热加载：修改保存后，下一次订阅转换 / 生成最新配置即生效）
#
# 说明：
# - 调整分组默认选中项（mihomo select 组首项即默认）与追加自定义分组，
#   转换结果其余部分保持远程模板原样
# - group_defaults 目标组在模板中不存在时自动跳过（如 Custom_Clash.ini 无 PT站点组），
#   不会插入悬空引用
# - custom_groups 按 filter 在 mihomo 运行时筛选节点（机场 provider 形态）或
#   直接点名静态节点；attach_to 把该组挂进目标分组的可选列表
# - 对所有远程配置变体（Custom_Clash / _Full / _Fallback / _GFW）统一生效；
#   _Fallback 的 fallback 组同样把目标组置为第一顺位（主节点）

# 保持 GitHub 上游远程模板原样，不覆盖调整任何分组默认出口
group_defaults: []

# 自定义节点组：供服务手动选择（机场 provider 形态按 filter 运行时筛选；静态节点直接点名）。
# 如需启用自定义组，在此列表按需声明。
custom_groups: []
