# 转换增强外置配置（热加载：修改保存后，下一次订阅转换 / 生成最新配置即生效）
#
# 说明：
# - 调整分组默认选中项（mihomo select 组首项即默认）与追加自定义分组，
#   转换结果其余部分保持远程模板原样
# - group_defaults 目标组在模板中不存在时自动跳过（如 Custom_Clash.ini 无 PT站点组），
#   不会插入悬空引用
# - custom_groups 按 filter 在 mihomo 运行时筛选节点（机场 provider 形态）或
#   直接点名静态节点；attach_to 把该组挂进目标分组的可选列表
# - 对所有远程配置变体（Custom_Clash / _Full / _Fallback / _GFW）统一生效；
#   _Fallback 的 fallback 组同样把目标组置为第一顺位（主节点）

group_defaults:
  # 非标端口（PT/BT 优化：80/443 以外端口）默认直连
  - {group: "🔀 非标端口", default: "🎯 全球直连"}
  # PT 站点默认直连（仅 Custom_Clash_Full 等含 PT站点组的模板生效）
  - {group: "⏬ PT站点", default: "🎯 全球直连"}

  # ---- 2026-09-04 服务分流默认出口 ----
  # AI / 谷歌系 → 新加坡节点
  - {group: "🤖 ChatGPT", default: "🇸🇬 新加坡节点"}
  - {group: "🤖 AI服务", default: "🇸🇬 新加坡节点"}
  - {group: "🇬 谷歌服务", default: "🇸🇬 新加坡节点"}
  - {group: "📢 谷歌FCM", default: "🇸🇬 新加坡节点"}
  # TikTok / YouTube → 美国节点
  - {group: "🎶 TikTok", default: "🇺🇸 美国节点"}
  - {group: "📹 YouTube", default: "🇺🇸 美国节点"}
  # 微软 / 苹果 / 测速工具 → 手动选择（不再默认直连或自动）
  - {group: "Ⓜ️ 微软服务", default: "🚀 手动选择"}
  - {group: "🍎 苹果服务", default: "🚀 手动选择"}
  - {group: "🚀 测速工具", default: "🚀 手动选择"}

# 自定义节点组：节点名含「流媒体」的节点聚成一组，供 YouTube / TikTok 等
# 媒体服务手动选择（机场 provider 形态按 filter 运行时筛选；静态节点直接点名）。
# attach_after=美国节点：紧跟默认项（美国节点）置为第二顺位；无该锚点的组退化追加末尾。
custom_groups:
  - name: "🎬 流媒体"
    filter: "流媒体"
    type: select
    attach_after: "🇺🇸 美国节点"
    attach_to:
      - "📹 YouTube"
      - "🎶 TikTok"
      - "🎥 Netflix"
      - "🎥 DisneyPlus"
      - "🎥 HBO"
      - "🎥 PrimeVideo"
      - "🎥 AppleTV+"
      - "🎥 Emby"
      - "🎻 Spotify"
      - "📺 Bahamut"
      - "🌎 国外媒体"
  # 电信优化：新加坡/日本 的电信/联通/移动 优化线路（节点名形如「新加坡 电信CT」）
  - name: "📡 电信优化"
    filter: "(新加坡|SG|日本|JP).*(电信|CT(CUCM|CU|CM))"
    type: select
    attach_to:
      - "🚀 手动选择"
      - "🚀 故障转移"
